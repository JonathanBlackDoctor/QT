name: Verify and deploy recovered QT 2026-09-13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-2026-09-13.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qt-publish
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: macos-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      TARGET_DATE: '2026-09-13'
      PAGES_BASE_URL: https://JonathanBlackDoctor.github.io/QT/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify recovered record is locally ready
        env:
          REQUESTED_DATE: '2026-09-13'
        run: |
          node scripts/validate.mjs --date=2026-09-13
          PAGES_BASE_URL="" node scripts/qt-readiness.mjs --require-ready
      - name: Build site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published recovered record
        env:
          REQUESTED_DATE: '2026-09-13'
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Published-copy verification attempt $attempt/4"
            if node scripts/qt-readiness.mjs --require-ready; then
              exit 0
            fi
            if (( attempt < 4 )); then sleep $((attempt * 4)); fi
          done
          echo "::error::Published recovered QT did not converge after repeated checks."
          exit 1
