name: Generate daily QT

on:
  schedule:
    # Primary and first recovery, expressed in UTC.
    - cron: '5 15 * * *' # 00:05 KST
    - cron: '20 15 * * *' # 00:20 KST
    # Bounded catch-up window, including after the 04:00 reader rollover.
    - cron: '35,50 15 * * *' # 00:35, 00:50 KST
    - cron: '5,20,35,50 16-19 * * *' # 01:05 through 04:50 KST
  # A pipeline repair should recover missing content immediately, not wait a day.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-qt.yml'
      - 'prompts/qt-system.md'
      - 'scripts/generate.mjs'
      - 'scripts/evidence.mjs'
      - 'scripts/lib.mjs'
      - 'scripts/transport.mjs'
      - 'scripts/qt-readiness.mjs'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (KST calendar date). Empty = current KST date'
        required: false
        type: string
      force:
        description: 'Regenerate an existing date'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qt-publish
  cancel-in-progress: false
jobs:
  generate-and-deploy:
    # 2026-09-07 controlled comparison: SU timed out on Ubuntu; macOS returned 200.
    # This is a generation transport fix, not a guarantee about schedule delivery.
    runs-on: macos-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      PAGES_BASE_URL: https://JonathanBlackDoctor.github.io/QT/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve calendar date and check content/publication
        id: ready
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          FORCE_GENERATION: ${{ inputs.force }}
          RETRY_PERSPECTIVES: ${{ github.event_name == 'schedule' && github.event.schedule == '20 15 * * *' }}
        run: node scripts/qt-readiness.mjs
      - name: Already generated and published
        if: steps.ready.outputs.needs_deployment != 'true'
        run: echo 'Verified dated content and its published copy match. No model call or deployment needed.'
      - name: Run unit tests
        if: steps.ready.outputs.needs_deployment == 'true'
        run: node --test scripts/*.test.mjs
      - uses: actions/cache@v4
        if: steps.ready.outputs.needs_enrichment == 'true'
        with:
          path: .cache/project-sources
          key: project-sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: project-sources-v1-
      - name: Repair SU DNS resolution (best effort)
        if: steps.ready.outputs.needs_generation == 'true'
        shell: bash
        run: |
          set -u
          for host in sum.su.or.kr su.or.kr; do
            if python3 - "$host" <<'PY'
          import socket
          import sys
          try:
              socket.getaddrinfo(sys.argv[1], 443)
          except OSError:
              raise SystemExit(1)
          PY
            then
              continue
            fi

            echo "System DNS could not resolve $host; trying DNS-over-HTTPS."
            ip="$(curl -fsS --max-time 8 "https://dns.google/resolve?name=${host}&type=A" \
              | python3 -c 'import ipaddress,json,sys; d=json.load(sys.stdin); print(next((a["data"] for a in d.get("Answer",[]) if a.get("type")==1 and ipaddress.ip_address(a.get("data","")).version==4),""))' 2>/dev/null || true)"
            if [[ -n "$ip" ]]; then
              echo "$ip $host" | sudo tee -a /etc/hosts >/dev/null
              echo "Added a temporary DNS fallback for $host."
            else
              echo "::warning::Could not establish a DNS fallback for $host; generator retries remain enabled."
            fi
          done
      - name: Generate missing or incomplete QT
        id: generate
        if: steps.ready.outputs.needs_generation == 'true'
        env:
          TARGET_DATE: ${{ steps.ready.outputs.date }}
          FORCE_GENERATION: ${{ steps.ready.outputs.force_generation }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID || vars.GOOGLE_CSE_ID }}
          READING_JESUS_CHANNEL_ID: ${{ vars.READING_JESUS_CHANNEL_ID }}
        shell: bash
        run: |
          args=("--date=$TARGET_DATE")
          if [[ "$FORCE_GENERATION" == "true" ]]; then args+=(--force); fi

          for attempt in 1 2 3; do
            echo "QT generation attempt $attempt/3"
            if node scripts/generate.mjs "${args[@]}"; then
              if REQUESTED_DATE="$TARGET_DATE" PAGES_BASE_URL="" node scripts/qt-readiness.mjs --require-ready; then
                exit 0
              fi
            fi
            if (( attempt < 3 )); then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::QT generation did not produce a locally ready record after 3 attempts."
          exit 1
      - name: Supplement project perspectives (non-blocking)
        if: steps.ready.outputs.needs_enrichment == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          TARGET_DATE: ${{ steps.ready.outputs.date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID || vars.GOOGLE_CSE_ID }}
          READING_JESUS_CHANNEL_ID: ${{ vars.READING_JESUS_CHANNEL_ID }}
        run: node scripts/enrich-projects.mjs "--date=$TARGET_DATE"
      - name: Validate content
        if: steps.ready.outputs.needs_deployment == 'true'
        run: |
          node scripts/validate.mjs
          node scripts/validate-projects.mjs
      - name: Commit generated content
        if: steps.ready.outputs.needs_deployment == 'true'
        env:
          TARGET_DATE: ${{ steps.ready.outputs.date }}
        shell: bash
        run: |
          git add content
          if ! git diff --cached --quiet; then
            git config user.name "qt-daily-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: daily QT $TARGET_DATE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site
        if: steps.ready.outputs.needs_deployment == 'true'
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
        if: steps.ready.outputs.needs_deployment == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.ready.outputs.needs_deployment == 'true'
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        if: steps.ready.outputs.needs_deployment == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Require successful dated content and verify its published copy
        if: always() && steps.ready.outputs.needs_deployment == 'true' && (steps.generate.outcome == 'success' || steps.generate.outcome == 'skipped')
        env:
          REQUESTED_DATE: ${{ steps.ready.outputs.date }}
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Published-copy verification attempt $attempt/4"
            if node scripts/qt-readiness.mjs --require-ready; then
              exit 0
            fi
            if (( attempt < 4 )); then
              sleep $((attempt * 4))
            fi
          done
          echo "::error::Published QT did not converge to the generated copy after repeated checks."
          exit 1
