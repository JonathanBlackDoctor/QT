name: Generate daily QT

on:
  schedule:
    # Primary and first recovery, expressed in UTC.
    - cron: '5 15 * * *' # 00:05 KST
    - cron: '20 15 * * *' # 00:20 KST
    # Bounded catch-up window, including after the 04:00 reader rollover.
    - cron: '35,50 15 * * *' # 00:35, 00:50 KST
    - cron: '5,20,35,50 16-19 * * *' # 01:05 through 04:50 KST
  # A pipeline repair should recover missing content immediately, not wait a day.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-qt.yml'
      - 'scripts/qt-readiness.mjs'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (KST calendar date). Empty = current KST date'
        required: false
        type: string
      force:
        description: 'Regenerate an existing date'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qt-publish
  cancel-in-progress: false
jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      PAGES_BASE_URL: https://JonathanBlackDoctor.github.io/QT/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve calendar date and check content/publication
        id: ready
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          FORCE_GENERATION: ${{ inputs.force }}
        run: node scripts/qt-readiness.mjs
      - name: Already generated and published
        if: steps.ready.outputs.needs_deployment != 'true'
        run: echo 'Verified dated content and its published copy match. No model call or deployment needed.'
      - name: Run unit tests
        if: steps.ready.outputs.needs_deployment == 'true'
        run: node --test scripts/*.test.mjs
      - uses: actions/cache@v4
        if: steps.ready.outputs.needs_generation == 'true'
        with:
          path: .cache/project-sources
          key: project-sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: project-sources-v1-
      - name: Generate missing or incomplete QT
        if: steps.ready.outputs.needs_generation == 'true'
        env:
          TARGET_DATE: ${{ steps.ready.outputs.date }}
          FORCE_GENERATION: ${{ steps.ready.outputs.force_generation }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID || vars.GOOGLE_CSE_ID }}
          READING_JESUS_CHANNEL_ID: ${{ vars.READING_JESUS_CHANNEL_ID }}
        shell: bash
        run: |
          args=("--date=$TARGET_DATE")
          if [[ "$FORCE_GENERATION" == "true" ]]; then args+=(--force); fi
          node scripts/generate.mjs "${args[@]}"
      - name: Supplement project perspectives (non-blocking)
        if: steps.ready.outputs.needs_generation == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          TARGET_DATE: ${{ steps.ready.outputs.date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          READING_JESUS_CHANNEL_ID: ${{ vars.READING_JESUS_CHANNEL_ID }}
        run: node scripts/enrich-projects.mjs "--date=$TARGET_DATE"
      - name: Validate content
        if: steps.ready.outputs.needs_deployment == 'true'
        run: |
          node scripts/validate.mjs
          node scripts/validate-projects.mjs
      - name: Commit generated content
        if: steps.ready.outputs.needs_deployment == 'true'
        env:
          TARGET_DATE: ${{ steps.ready.outputs.date }}
        shell: bash
        run: |
          git add content
          if ! git diff --cached --quiet; then
            git config user.name "qt-daily-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: daily QT $TARGET_DATE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site
        if: steps.ready.outputs.needs_deployment == 'true'
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
        if: steps.ready.outputs.needs_deployment == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.ready.outputs.needs_deployment == 'true'
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        if: steps.ready.outputs.needs_deployment == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Require successful dated content and verify its published copy
        if: always() && steps.ready.outputs.needs_deployment == 'true'
        env:
          REQUESTED_DATE: ${{ steps.ready.outputs.date }}
        run: node scripts/qt-readiness.mjs --require-ready
