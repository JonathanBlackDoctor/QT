name: Generate daily QT

on:
  schedule:
    # UTC cron: 00:05 KST and recovery at 00:20 KST.
    - cron: '5 15 * * *'
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (KST calendar date). Empty = current KST date'
        required: false
        type: string
      force:
        description: 'Regenerate an existing date'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qt-publish
  cancel-in-progress: false
jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: .cache/project-sources
          key: project-sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: project-sources-v1-
      - name: Run unit tests
        run: node --test scripts/*.test.mjs
      - name: Resolve date safely
        id: args
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          DATE="${REQUESTED_DATE:-$(TZ=Asia/Seoul date +%F)}"
          export DATE
          node --input-type=module -e 'const d=process.env.DATE;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||Number.isNaN(Date.parse(d+"T00:00:00Z"))||new Date(d+"T00:00:00Z").toISOString().slice(0,10)!==d)process.exit(1)'
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
      - name: Generate QT and supplement project perspectives
        env:
          TARGET_DATE: ${{ steps.args.outputs.date }}
          FORCE_GENERATION: ${{ inputs.force }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID || vars.GOOGLE_CSE_ID }}
          READING_JESUS_CHANNEL_ID: ${{ vars.READING_JESUS_CHANNEL_ID }}
        shell: bash
        run: |
          args=("--date=$TARGET_DATE")
          if [[ "$FORCE_GENERATION" == "true" ]]; then args+=(--force); fi
          node scripts/generate.mjs "${args[@]}"
          # Runs even when an existing status=ok QT was skipped by the main generator.
          node scripts/enrich-projects.mjs "--date=$TARGET_DATE"
      - name: Validate content
        run: |
          node scripts/validate.mjs
          node scripts/validate-projects.mjs
      - name: Commit generated content
        env:
          TARGET_DATE: ${{ steps.args.outputs.date }}
        shell: bash
        run: |
          git add content
          if ! git diff --cached --quiet; then
            git config user.name "qt-daily-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: daily QT $TARGET_DATE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
