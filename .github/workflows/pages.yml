name: Deploy Pages
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'scripts/*.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      cancel_blocking_deployment:
        description: 'Optional exact SHA of an older Pages deployment reported as blocking'
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: qt-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel the specified blocking Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.cancel_blocking_deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKING_DEPLOYMENT: ${{ inputs.cancel_blocking_deployment }}
        shell: bash
        run: |
          if [[ ! "$BLOCKING_DEPLOYMENT" =~ ^[0-9a-f]{40}$ || "$BLOCKING_DEPLOYMENT" == "$GITHUB_SHA" ]]; then
            echo "::error::Enter the exact 40-character SHA of an older blocking deployment."
            exit 1
          fi
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$BLOCKING_DEPLOYMENT/cancel"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/validate.mjs && node scripts/validate-projects.mjs
      - name: Build site
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
