name: Supplement project perspectives
on:
  push:
    branches: [main]
    paths: ['.github/workflows/project-perspectives.yml', 'scripts/project-sources.mjs']
  workflow_dispatch:
    inputs:
      dates:
        description: 'Comma-separated existing dates; only project sections will be supplemented'
        required: true
        default: '2026-09-05,2026-09-06'
        type: string
      force:
        description: 'Refresh already successful project sections (never remove them on failure)'
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qt-publish
  cancel-in-progress: false
jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: .cache/project-sources
          key: project-sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: project-sources-v1-
      - name: Run tests
        run: node --test scripts/*.test.mjs
      - name: Supplement requested dates without regenerating QT
        env:
          TARGET_DATES: ${{ inputs.dates || '2026-09-05,2026-09-06' }}
          FORCE_REFRESH: ${{ inputs.force }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID || vars.GOOGLE_CSE_ID }}
          READING_JESUS_CHANNEL_ID: ${{ vars.READING_JESUS_CHANNEL_ID }}
        shell: bash
        run: |
          args=("--dates=$TARGET_DATES")
          if [[ "$FORCE_REFRESH" == "true" ]]; then args+=(--force); fi
          node scripts/enrich-projects.mjs "${args[@]}"
      - name: Validate both content and project provenance
        run: |
          node scripts/validate.mjs
          node scripts/validate-projects.mjs
      - name: Commit supplemented content
        shell: bash
        run: |
          git add content
          if ! git diff --cached --quiet; then
            git config user.name "qt-project-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: supplement verified project perspectives"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
