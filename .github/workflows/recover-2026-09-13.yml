name: Recover QT 2026-09-13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-2026-09-13.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qt-publish
  cancel-in-progress: false

jobs:
  recover-and-deploy:
    runs-on: macos-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      TARGET_DATE: '2026-09-13'
      PAGES_BASE_URL: https://JonathanBlackDoctor.github.io/QT/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run unit tests
        run: node --test scripts/*.test.mjs
      - name: Validate restored content before enrichment
        run: node scripts/validate.mjs "--date=$TARGET_DATE"
      - name: Supplement project perspectives (non-blocking)
        continue-on-error: true
        timeout-minutes: 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID || vars.GOOGLE_CSE_ID }}
          READING_JESUS_CHANNEL_ID: ${{ vars.READING_JESUS_CHANNEL_ID }}
        run: node scripts/enrich-projects.mjs "--date=$TARGET_DATE"
      - name: Validate all content
        run: |
          node scripts/validate.mjs
          node scripts/validate-projects.mjs
      - name: Commit optional enrichment
        shell: bash
        run: |
          git add content
          if ! git diff --cached --quiet; then
            git config user.name "qt-daily-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: enrich recovered QT $TARGET_DATE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published recovered copy
        shell: bash
        env:
          REQUESTED_DATE: '2026-09-13'
        run: |
          for attempt in 1 2 3 4; do
            echo "Published-copy verification attempt $attempt/4"
            if node scripts/qt-readiness.mjs --require-ready; then exit 0; fi
            if (( attempt < 4 )); then sleep $((attempt * 4)); fi
          done
          exit 1
