name: Sanitize first QT evidence claims

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sanitize-first-qt.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sanitize-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove unsupported expansions from first QT
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          jp = Path('content/2026/09/2026-09-06.json')
          doc = json.loads(jp.read_text(encoding='utf-8'))

          doc['sections']['commentary'] = (
            "사사기 3장 1-11절은 언약 백성의 훈련, 배교, 그리고 하나님의 구원 개입을 압축적으로 보여줍니다. "
            "1-4절에서 하나님이 이방 민족을 남겨 두신 목적은 '시험'(Strong's 5254, לְנַסּוֹת)이었습니다. "
            "평탄함 속에서 영적 긴장감을 잃지 않고 하나님을 의지하여 싸우는 법을 배우게 하려 하셨으나, 이스라엘은 이 기회를 영적 성장이 아닌 세속화의 통로로 바꾸어 버렸습니다(성서유니온 매일성경 해설 및 BibleHub 참조). "
            "5-6절에 나타난 통혼과 우상 숭배는 단순한 문화적 교류가 아니라 언약적 배도였으며, 7절은 그 결과를 여호와를 잊어버리는 망각으로 묘사합니다. "
            "하나님은 메소보다미아 왕 구산 리사다임을 통해 8년 동안 이스라엘이 압제를 겪게 하셨고, 백성들이 고통 가운데 부르짖을 때 첫 사사 옷니엘을 세우셨습니다. "
            "10절은 여호와의 영이 옷니엘에게 임했고 그가 구산 리사다임을 이겼으며, 이후 그 땅이 40년 동안 평온했다고 전합니다. "
            "본문의 강조점은 이스라엘의 반복되는 불순종 속에서도 하나님이 부르짖음을 들으시고 구원자를 세우시는 신실하심에 있습니다."
          )
          doc['sections']['language'] = (
            "본문 1절의 '시험하려'에 해당하는 히브리어 형태 לְנַסּוֹת와 Strong's 5254가 BibleHub 원문 분석 페이지에서 직접 확인됩니다. "
            "여기서는 이 확인된 형태만 사용하며, 다른 절의 원어를 기억이나 추론으로 보충하지 않습니다. "
            "문맥상 이 시험은 4절이 설명하듯 이스라엘이 여호와의 명령에 순종하는지를 드러내는 시험입니다."
          )
          doc['sections']['christological'] = (
            "이 Evidence Bundle에서는 사사기 3:1-11을 그리스도에 대한 명시적 신약 인용이나 직접적인 성취 본문으로 규정할 근거를 확인하지 못했습니다. "
            "따라서 옷니엘을 그리스도의 직접적 예표라고 단정하지 않습니다. "
            "다만 반복되는 죄와 압제 속에서 하나님이 구원자를 세우고 백성에게 평온을 주신다는 본문의 구원 주제는, 성경 전체에서 하나님이 자기 백성을 구원하신다는 더 큰 이야기와 정경적·신학적 유사성을 통해 묵상할 수 있습니다. "
            "이 연결은 본문의 직접 예언을 주장하는 것이 아니라, 확인된 본문 주제를 따라 절제하여 제시하는 신학적 묵상입니다."
          )
          for source in doc.get('sources', []):
            if source.get('url') == 'https://biblehub.com/judges/3.htm':
              source['usedFor'] = '역사적 배경, 사사기 3장 구조 및 옷니엘의 구원 사역 관련 주석'
          doc['reviewedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          doc['reviewNote'] = 'Evidence-compliance review: unsupported cross-reference and unverified original-language expansion removed.'
          jp.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          mp = Path('content/2026/09/2026-09-06.md')
          text = mp.read_text(encoding='utf-8')
          old_commentary = "사사기 3장 1-11절은 언약 백성의 훈련, 배교, 그리고 하나님의 구원 개입을 압축적으로 보여줍니다. 1-4절에서 하나님이 이방 민족을 남겨 두신 목적은 '시험'(Strong's 5254, לְנַסּוֹת)이었습니다. 평탄함 속에서 영적 긴장감을 잃지 않고 오직 하나님만을 의지하여 싸우는 법을 배우게 하려 하셨으나, 이스라엘은 이 기회를 영적 성장이 아닌 세속화의 통로로 바꾸어 버렸습니다(성서유니온 매일성경 해설 및 BibleHub 참조). 5-6절에 나타난 통혼과 우상 숭배는 단순한 문화적 교류가 아니라 언약적 배도였으며, 그 결과 7절이 지적하듯 여호와를 잊어버리는 망각에 도달했습니다. 하나님은 메소보다미아 왕 구산 리사다임을 도구로 삼아 8년 동안 징계하심으로써 온 열방의 역사를 다스리는 주권자이심을 드러내셨습니다. 백성들이 고통 가운데 부르짖을 때 하나님은 첫 사사 옷니엘을 세우셨습니다. 성경은 '여호와의 영'(히브리어 'רוּחַ', ruach)이 옷니엘에게 임하여 구산 리사다임을 물리치고 40년간의 평온을 이끌어 냈음을 증언합니다. 이는 구원이 인간의 군사적 탁월함이 아니라 하나님의 영적 주도권과 신실한 자비로부터 비롯됨을 분명히 합니다."
          new_commentary = doc['sections']['commentary']
          old_language = "본문 1절에서 '시험하려'(Strong's 5254)로 번역된 히브리어는 '나사'(נָסָה)의 피엘 부정사 연계형 '레나소트'(לְנַסּוֹת)입니다. 이는 멸망을 위한 유혹이 아니라 순종과 충성을 입증하고 단련하기 위한 연단의 시험을 의미합니다. 또한 10절에서 사사 옷니엘을 무장시킨 하나님의 영은 히브리어 '루아흐'(רוּחַ, BibleHub 자료 참조)로, 위기 속에서 하나님의 사람에게 주어지는 신적 권능과 사명 부여를 나타냅니다."
          old_christ = "사사 옷니엘을 통한 구원 사역은 신약의 구속사와 깊은 정경적·예표적 공명을 이룹니다(BibleHub 주석 참조). 이스라엘의 반복된 반역과 무력함 속에서 성령의 임재로 대적을 물리치고 참된 안식을 가져온 사사의 모습은, 성령의 기름 부으심을 받아(누가복음 4:18 참조) 사탄과 죄의 권세를 꺾으시고 자기 백성에게 영원한 평강을 주신 예수 그리스도의 완전한 구원 사역을 미리 바라보게 합니다."
          text = text.replace(old_commentary, new_commentary)
          text = text.replace(old_language, doc['sections']['language'])
          text = text.replace(old_christ, doc['sections']['christological'])
          text = text.replace('역사적 배경, 사사기 순환 구조, 옷니엘의 구원 사역 및 정경적·예표적 연결', '역사적 배경, 사사기 3장 구조 및 옷니엘의 구원 사역 관련 주석')
          mp.write_text(text, encoding='utf-8')
          PY

          node scripts/validate.mjs --date=2026-09-06
          if grep -q '누가복음 4:18\|רוּחַ\|נָסָה' content/2026/09/2026-09-06.json; then
            echo 'Unsupported expansion remains in JSON.' >&2
            exit 1
          fi
          git diff --check
      - name: Commit sanitized QT
        shell: bash
        run: |
          git config user.name "qt-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/2026/09/2026-09-06.json content/2026/09/2026-09-06.md
          git commit -m "content: evidence-compliance review for 2026-09-06"
          git push
      - name: Build site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
